<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Call Tips Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: transparent;
    color: #e2e8f0;
    font-size: 12px;
    user-select: none;
    overflow: hidden;
    height: 100vh;
  }
  .window {
    background: rgba(15, 17, 23, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .titlebar {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    -webkit-app-region: drag;
    cursor: move;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }
  .rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; animation: pulse 1.2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .title-text { font-size: 11px; color: #94a3b8; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stop-btn {
    -webkit-app-region: no-drag;
    background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3);
    color: #ef4444; border-radius: 5px; padding: 3px 8px; font-size: 11px;
    cursor: pointer; flex-shrink: 0;
  }
  .stop-btn:hover { background: rgba(239,68,68,.25); }
  .pin-btn {
    -webkit-app-region: no-drag;
    background: rgba(99,102,241,.2); border: 1px solid rgba(99,102,241,.4);
    color: #818cf8; border-radius: 5px; padding: 3px 8px; font-size: 11px;
    cursor: pointer; flex-shrink: 0;
  }
  .pin-btn.unpinned {
    background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1);
    color: #4a5568;
  }
  .pin-btn:hover { opacity: .8; }

  .tabs {
    display: flex;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .tab {
    flex: 1; padding: 7px; text-align: center; font-size: 11px;
    color: #4a5568; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab.active { color: #6366f1; border-bottom-color: #6366f1; }

  .content { flex: 1; overflow: hidden; position: relative; -webkit-app-region: no-drag; }
  .pane { position: absolute; inset: 0; overflow-y: auto; padding: 10px; display: none; }
  .pane.active { display: block; }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  /* Tips — plain text */
  .tips-block { animation: fadeIn .2s; }
  .tip-line { font-size: 12px; line-height: 1.6; margin-bottom: 6px; color: #e2e8f0; }
  .tip-line .tip-emoji { margin-right: 4px; }
  .tip-line.dig   { color: #fff; font-size: 13px; }
  .tip-line.next  { color: #cbd5e1; }
  .tip-line.why   { color: #94a3b8; }
  .tips-divider { border: none; border-top: 1px solid rgba(255,255,255,.07); margin: 8px 0; }
  .tips-prev { opacity: .4; font-size: 11px; line-height: 1.5; color: #64748b; margin-bottom: 5px; }

  .no-tips { color: #4a5568; font-size: 12px; text-align: center; padding: 20px 0; }

  /* Plan questions */
  .plan-q {
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
    border-radius: 7px; padding: 7px 10px; margin-bottom: 5px; cursor: pointer;
    font-size: 12px; transition: background .12s;
  }
  .plan-q:hover { background: rgba(99,102,241,.1); }
  .plan-q.asked { opacity: .4; text-decoration: line-through; }
  .plan-q .fu { font-size: 11px; color: #94a3b8; margin-top: 3px; }
  .section-title { font-size: 10px; color: #6366f1; text-transform: uppercase; letter-spacing: .5px; margin: 10px 0 4px; }
  .section-title:first-child { margin-top: 0; }

  /* Transcript */
  .tx-line { margin-bottom: 3px; font-size: 11px; line-height: 1.5; }
  .tx-me { color: #818cf8; }
  .tx-them { color: #e2e8f0; }
  .tx-interim { opacity: .5; font-style: italic; }

  /* System audio button */
  .audio-opts { padding: 10px; border-top: 1px solid rgba(255,255,255,.07); flex-shrink: 0; -webkit-app-region: no-drag; }
  .sys-btn {
    width: 100%; padding: 5px; background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08); border-radius: 6px;
    color: #94a3b8; font-size: 11px; cursor: pointer;
  }
  .sys-btn:hover { background: rgba(255,255,255,.08); }
  .sys-btn.active { border-color: #4ade80; color: #4ade80; }

  .status-bar { padding: 4px 12px; font-size: 10px; color: #4a5568; border-top: 1px solid rgba(255,255,255,.05); flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-app-region: no-drag; }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="rec-dot" id="recDot" style="display:none"></div>
    <span class="title-text" id="titleText">Подключение…</span>
    <button class="pin-btn" id="pinBtn" title="Поверх всех окон">📌 Поверх</button>
    <button class="stop-btn" id="stopBtn">■ Стоп</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="tips">⚡ Подсказки</div>
    <div class="tab" data-tab="plan">📋 План</div>
    <div class="tab" data-tab="transcript">📝 Транскрипт</div>
  </div>

  <div class="content">
    <div class="pane active" id="pane-tips">
      <div class="no-tips" id="noTips">Слушаю…</div>
    </div>
    <div class="pane" id="pane-plan">
      <div id="planEl"><div class="no-tips">План не загружен</div></div>
    </div>
    <div class="pane" id="pane-transcript">
      <div id="txEl"></div>
    </div>
  </div>

  <div class="audio-opts">
    <button class="sys-btn" id="sysBtn">🔊 + Звук встречи (поделитесь экраном)</button>
  </div>
  <div class="status-bar" id="statusBar">Ожидание данных сессии…</div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let session = null;          // {candidateName, resumeText, jobText, duration, lang, deepgramKey, plan}
let transcript = [];         // {speaker:'me'|'them', text, final}
let finalCount = 0;
let dgWs = null;             // Deepgram WebSocket (mic)
let dgSysWs = null;          // Deepgram WebSocket (system audio)
let audioCtx = null;
let micStream = null;
let sysStream = null;
let isFetchingTips = false;
let questionsAsked = new Set();
let tipHistory = []; // [{dig, next, why}] — last 5 sets

// ── Tabs ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + tab.dataset.tab));
  });
});

// ── Session init ───────────────────────────────────────────────────────────
window.api.onSessionData(async (data) => {
  session = data;
  document.getElementById('titleText').textContent = session.candidateName || 'Звонок';
  renderPlan(session.plan);
  setStatus('Запускаю микрофон…');
  await startMic();
});

// ── Pin toggle ─────────────────────────────────────────────────────────────
let pinned = true;
document.getElementById('pinBtn').addEventListener('click', async () => {
  pinned = await window.api.togglePin();
  const btn = document.getElementById('pinBtn');
  if (pinned) {
    btn.textContent = '📌 Поверх';
    btn.classList.remove('unpinned');
  } else {
    btn.textContent = '📌 Не поверх';
    btn.classList.add('unpinned');
  }
});

// ── Stop ───────────────────────────────────────────────────────────────────
document.getElementById('stopBtn').addEventListener('click', () => {
  stopAll();
  window.api.stopCall();
});

function stopAll() {
  dgWs?.close();
  dgSysWs?.close();
  micStream?.getTracks().forEach(t => t.stop());
  sysStream?.getTracks().forEach(t => t.stop());
  audioCtx?.close();
  dgWs = dgSysWs = audioCtx = micStream = sysStream = null;
  document.getElementById('recDot').style.display = 'none';
}

// ── Microphone ─────────────────────────────────────────────────────────────
async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new AudioContext({ sampleRate: 16000 });
    await audioCtx.audioWorklet.addModule('audio-processor.js');
    const src = audioCtx.createMediaStreamSource(micStream);
    const worklet = new AudioWorkletNode(audioCtx, 'pcm-processor');
    src.connect(worklet);
    worklet.port.onmessage = (e) => dgWs?.readyState === WebSocket.OPEN && dgWs.send(e.data);
    dgWs = connectDeepgram(session.deepgramKey, session.lang || 'ru', 'me');
    document.getElementById('recDot').style.display = 'block';
    setStatus('🎙 Запись микрофона…');
  } catch (e) {
    setStatus('❌ Нет доступа к микрофону: ' + e.message);
  }
}

// ── System audio (optional) ────────────────────────────────────────────────
document.getElementById('sysBtn').addEventListener('click', async () => {
  if (sysStream) {
    sysStream.getTracks().forEach(t => t.stop());
    dgSysWs?.close();
    sysStream = null; dgSysWs = null;
    document.getElementById('sysBtn').classList.remove('active');
    document.getElementById('sysBtn').textContent = '🔊 + Звук встречи (поделитесь экраном)';
    setStatus('Звук встречи отключён');
    return;
  }
  try {
    // On Windows: getDisplayMedia with audio captures system audio (WASAPI loopback)
    const stream = await navigator.mediaDevices.getDisplayMedia({ audio: true, video: { width: 1, height: 1 } });
    const audioTracks = stream.getAudioTracks();
    if (!audioTracks.length) { setStatus('Аудио экрана недоступно — выберите вкладку браузера или весь экран'); return; }
    // Stop video track (we only want audio)
    stream.getVideoTracks().forEach(t => t.stop());
    sysStream = new MediaStream(audioTracks);

    const sysCtx = new AudioContext({ sampleRate: 16000 });
    await sysCtx.audioWorklet.addModule('audio-processor.js');
    const src = sysCtx.createMediaStreamSource(sysStream);
    const worklet = new AudioWorkletNode(sysCtx, 'pcm-processor');
    src.connect(worklet);
    dgSysWs = connectDeepgram(session.deepgramKey, session.lang || 'ru', 'them');
    worklet.port.onmessage = (e) => dgSysWs?.readyState === WebSocket.OPEN && dgSysWs.send(e.data);

    document.getElementById('sysBtn').classList.add('active');
    document.getElementById('sysBtn').textContent = '🔊 Звук встречи ВКЛ (нажмите чтобы выкл)';
    setStatus('🎙+🔊 Запись микрофона и встречи');
  } catch (e) {
    setStatus('Отменено или ошибка: ' + e.message);
  }
});

// ── Deepgram WebSocket ─────────────────────────────────────────────────────
function connectDeepgram(apiKey, lang, speaker) {
  const url = `wss://api.deepgram.com/v1/listen?model=nova-3&smart_format=true&interim_results=true&encoding=linear16&sample_rate=16000&channels=1&endpointing=500&language=${lang}`;
  const ws = new WebSocket(url, ['token', apiKey]);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => setStatus('✅ Deepgram подключён, говорите…');
  ws.onclose = (e) => { if (e.code !== 1000) setStatus('Deepgram отключён: ' + e.code); };
  ws.onerror = () => setStatus('❌ Ошибка Deepgram WebSocket');

  let interimIdx = -1;
  ws.onmessage = (evt) => {
    if (typeof evt.data !== 'string') return;
    let msg;
    try { msg = JSON.parse(evt.data); } catch { return; }
    const alt = msg.channel?.alternatives?.[0];
    if (!alt?.transcript) return;

    const text = alt.transcript.trim();
    if (!text) return;

    if (msg.is_final) {
      if (interimIdx >= 0 && transcript[interimIdx]) {
        transcript[interimIdx] = { speaker, text, final: true };
        interimIdx = -1;
      } else {
        transcript.push({ speaker, text, final: true });
      }
      finalCount++;
      renderTranscript();
      if (finalCount % 2 === 0) maybeFetchTips();
    } else {
      if (interimIdx >= 0 && transcript[interimIdx]) {
        transcript[interimIdx] = { speaker, text, final: false };
      } else {
        interimIdx = transcript.length;
        transcript.push({ speaker, text, final: false });
      }
      renderTranscript();
    }
  };
  return ws;
}

// ── Transcript render ──────────────────────────────────────────────────────
function renderTranscript() {
  const el = document.getElementById('txEl');
  const last40 = transcript.slice(-40);
  el.innerHTML = last40.map(l => {
    const cls = l.speaker === 'me' ? 'tx-me' : 'tx-them';
    const intCls = l.final ? '' : ' tx-interim';
    const label = l.speaker === 'me' ? 'Я' : 'Они';
    return `<div class="tx-line ${cls}${intCls}"><b>${label}:</b> ${escHtml(l.text)}</div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

// ── Tips fetch ─────────────────────────────────────────────────────────────
async function maybeFetchTips() {
  if (isFetchingTips || !session) return;
  isFetchingTips = true;
  setStatus('⏳ Думаю над подсказкой…');

  const planContext = buildPlanContext();
  const recent = transcript.filter(l => l.final).slice(-20).map(l =>
    `${l.speaker === 'me' ? 'Я' : 'Они'}: ${l.text}`
  ).join('\n');

  const messages = [{
    role: 'user',
    content: `Ты — помощник интервьюера в реальном времени. Слушаешь разговор и даёшь ОДИН острый уточняющий вопрос.

ПРАВИЛО: зацепись за конкретное слово или деталь из последней реплики собеседника. Не оценивай — уточняй.
Пример: собеседник сказал "делал лапароскопию" → следующий вопрос: "А когда вы выбираете открытую операцию вместо лапароскопии?"
Пример: сказал "работал с PostgreSQL" → "Расскажите о самой сложной проблеме с индексами, которую решали в PostgreSQL."

Собеседник: ${session.candidateName || 'собеседник'}
Тема: ${(session.jobText || '').slice(0, 300) || '(не указана)'}

ПЛАН (незаданные вопросы):
${planContext || '(без плана)'}

ПОСЛЕДНИЕ РЕПЛИКИ:
${recent || '(пока нет)'}

Верни ТОЛЬКО JSON (без обёртки):
{"next":"Если в плане есть незаданный важный вопрос — задай его. Иначе пустая строка.","dig":"ГЛАВНОЕ: один острый уточняющий вопрос к последней реплике собеседника — зацепись за конкретную деталь или ключевое слово. Всегда заполняй если есть реплики.","why":"Если собеседник дал размытый ответ — попроси конкретный пример. Иначе пустая строка."}
Язык ответа: ${session.lang === 'en' ? 'English' : 'русский'}. Пустая строка если подсказка не нужна.`
  }];

  try {
    const raw = await window.api.llmCall({ messages, maxTokens: 300, jsonMode: true });
    const tips = JSON.parse(raw);
    renderTips(tips);
    setStatus('✅ Deepgram подключён, говорите…');
  } catch (e) {
    setStatus('Ошибка LLM: ' + e.message);
  }
  isFetchingTips = false;
}

function buildPlanContext() {
  if (!session?.plan?.sections) return '';
  return session.plan.sections.flatMap(s =>
    s.questions.map((q, i) => {
      const id = `${s.category}-${i}`;
      const asked = questionsAsked.has(id) ? '[✓]' : '[ ]';
      return `${asked} ${q.text}${q.followUp ? ` (уточнение: ${q.followUp})` : ''}`;
    })
  ).join('\n');
}

// ── Tips render ────────────────────────────────────────────────────────────
function renderTips(tips) {
  if (tips.dig || tips.next || tips.why) {
    tipHistory.unshift(tips);
    if (tipHistory.length > 5) tipHistory.pop();
  }

  const el = document.getElementById('pane-tips');
  document.getElementById('noTips').style.display = 'none';
  el.querySelectorAll('.tips-block,.tips-divider,.tips-prev').forEach(c => c.remove());

  // Current tips as plain text
  const lines = [
    tips.dig  ? `<div class="tip-line dig"><span class="tip-emoji">🔍</span>${escHtml(tips.dig)}</div>`   : '',
    tips.next ? `<div class="tip-line next"><span class="tip-emoji">⚡</span>${escHtml(tips.next)}</div>` : '',
    tips.why  ? `<div class="tip-line why"><span class="tip-emoji">❓</span>${escHtml(tips.why)}</div>`   : '',
  ].join('');
  el.insertAdjacentHTML('beforeend', `<div class="tips-block">${lines}</div>`);

  // Previous tips (faded)
  tipHistory.slice(1).forEach(t => {
    const prev = [t.dig, t.next, t.why].filter(Boolean).join(' · ');
    if (prev) {
      el.insertAdjacentHTML('beforeend',
        `<hr class="tips-divider"><div class="tips-prev">${escHtml(prev)}</div>`);
    }
  });
}

// ── Plan render ────────────────────────────────────────────────────────────
function renderPlan(plan) {
  const el = document.getElementById('planEl');
  if (!plan?.sections?.length) { el.innerHTML = '<div class="no-tips">Без плана — подсказки в реальном времени</div>'; return; }
  const labels = { technical: '🔧 Профессиональный', soft: '🤝 Soft Skills', situational: '💡 Ситуационные' };
  el.innerHTML = plan.sections.map(sec => `
    <div class="section-title">${labels[sec.category] || sec.title || sec.category}</div>
    ${(sec.questions || []).map((q, i) => {
      const id = `${sec.category}-${i}`;
      return `<div class="plan-q" id="pq-${id}" onclick="toggleQuestion('${id}')">
        ${escHtml(q.text)}
        ${q.followUp ? `<div class="fu">↳ ${escHtml(q.followUp)}</div>` : ''}
      </div>`;
    }).join('')}
  `).join('');
}

function toggleQuestion(id) {
  if (questionsAsked.has(id)) questionsAsked.delete(id);
  else questionsAsked.add(id);
  const el = document.getElementById('pq-' + id);
  if (el) el.classList.toggle('asked', questionsAsked.has(id));
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setStatus(msg) { document.getElementById('statusBar').textContent = msg; }
function escHtml(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
